<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <!-- Makes the website work properly on mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>One Tiny Challenge 👀💙</title>

    <link rel="stylesheet" href="style.css">

    <!--
        face-api.js is the library that detects facial expressions.

        It can recognize expressions such as:
        happy, sad, angry, surprised, neutral, etc.
    -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>

</head>


<body>

    <div class="expression-page">

        <div class="expression-card">

            <div class="heart">
                💙
            </div>

            <h1>
                Waittt Bavaaa 👀
            </h1>

            <p>
                Before entering my surprise...
            </p>

            <p>
                I have one tiny challenge for you 😂
            </p>

            <h2>
                Give me your cutest smile 😁
            </h2>


            <!--
                This video element displays the camera.

                The browser will ask the person:
                "Allow this website to use your camera?"
            -->
            <video
                id="camera"
                autoplay
                muted
                playsinline>
            </video>


            <!--
                This message tells the person what is happening.
            -->
            <p id="status">
                Click the button to start 👀
            </p>


            <!--
                This button starts the camera.
            -->
            <button
                class="camera-button"
                onclick="startCamera()">

                Start Challenge 📷

            </button>


            <!--
                Initially this button is hidden.

                It will appear only after the required
                expression has been detected.
            -->
            <button
                id="selfieButton"
                class="camera-button"
                onclick="takeSelfie()"
                style="display:none;">

                Take My Selfie 📸

            </button>


            <!--
                Canvas is used internally to capture
                an image from the camera.
            -->
            <canvas
                id="snapshot"
                style="display:none;">
            </canvas>


            <!--
                This image will show the selfie
                after it has been captured.
            -->
            <img
                id="selfiePreview"
                style="display:none;"
                alt="Your selfie">


            <!--
                This button will appear after taking
                the selfie.
            -->
            <a
                id="continueButton"
                href="memories.html"
                class="button"
                style="display:none;">

                Okayyy... Enter 💙 →

            </a>

        </div>

    </div>


<script>


// ----------------------------------------------------
// STEP 1: Get references to HTML elements
// ----------------------------------------------------

const video = document.getElementById("camera");

const statusText = document.getElementById("status");

const selfieButton = document.getElementById("selfieButton");

const canvas = document.getElementById("snapshot");

const selfiePreview = document.getElementById("selfiePreview");

const continueButton = document.getElementById("continueButton");


// ----------------------------------------------------
// STEP 2: Start the camera
// ----------------------------------------------------

async function startCamera() {

    try {

        /*
            Ask the browser for access to the camera.

            facingMode: "user"
            means we want the FRONT CAMERA
            on a phone.
        */

        const stream = await navigator.mediaDevices.getUserMedia({

            video: {
                facingMode: "user"
            },

            audio: false

        });


        // Put the camera stream inside our <video>
        video.srcObject = stream;


        statusText.innerText =
            "Okayyy... now SMILE for me 😁💙";


        /*
            Start checking the person's face
            after the camera starts.
        */

        detectExpression();


    }

    catch (error) {

        /*
            This happens if the user refuses
            camera permission or the camera
            cannot be accessed.
        */

        statusText.innerText =
            "I need camera permission for this surprise 🥺📷";

        console.log(error);

    }

}


// ----------------------------------------------------
// STEP 3: Load the face detection models
// ----------------------------------------------------

async function loadModels() {

    /*
        These models tell face-api.js how to
        detect faces and expressions.

        We are loading them from a public CDN.
    */

    await faceapi.nets.tinyFaceDetector.loadFromUri(
        "https://justadudewhohacks.github.io/face-api.js/models"
    );


    await faceapi.nets.faceExpressionNet.loadFromUri(
        "https://justadudewhohacks.github.io/face-api.js/models"
    );

}


// ----------------------------------------------------
// STEP 4: Detect the expression
// ----------------------------------------------------

async function detectExpression() {

    statusText.innerText =
        "Looking for that smile... 👀😁";


    /*
        Check the camera every 500 milliseconds.

        This prevents the browser from checking
        hundreds of times per second.
    */

    const interval = setInterval(async () => {


        /*
            Detect a face from the video.
        */

        const detection =
            await faceapi
                .detectSingleFace(
                    video,
                    new faceapi.TinyFaceDetectorOptions()
                )
                .withFaceExpressions();


        // If no face is visible
        if (!detection) {

            statusText.innerText =
                "I can't see youuu 😂 Come closer!";

            return;

        }


        /*
            Get all detected expressions.
        */

        const expressions =
            detection.expressions;


        /*
            Get the probability that the person
            is HAPPY.

            Example:

            happy = 0.95

            means 95% confidence that the person
            is smiling/happy.
        */

        const happyScore =
            expressions.happy;


        console.log("Happy:", happyScore);


        /*
            We require at least 80% confidence.

            You can change 0.80 to:
            
            0.70 = easier
            0.80 = normal
            0.90 = harder
        */

        if (happyScore >= 0.80) {


            // Stop checking expressions
            clearInterval(interval);


            statusText.innerText =
                "AYYYYY 😭💙 I SAW THAT SMILEEE!";


            /*
                Now the expression requirement
                has been successfully completed.
            */

            selfieButton.style.display =
                "inline-block";


            selfieButton.innerText =
                "Now Take Your Selfie 📸";


        }

    }, 500);

}


// ----------------------------------------------------
// STEP 5: Take the selfie
// ----------------------------------------------------

function takeSelfie() {


    /*
        Get the camera size.
    */

    canvas.width =
        video.videoWidth;

    canvas.height =
        video.videoHeight;


    /*
        Draw the current camera frame
        onto the canvas.

        This creates the selfie.
    */

    const context =
        canvas.getContext("2d");


    context.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
    );


    /*
        Convert the canvas image into
        a normal image URL.
    */

    const selfie =
        canvas.toDataURL("image/jpeg");


    /*
        Show the selfie on the page.
    */

    selfiePreview.src =
        selfie;

    selfiePreview.style.display =
        "block";


    /*
        Hide the selfie button because
        the selfie has already been taken.
    */

    selfieButton.style.display =
        "none";


    statusText.innerText =
        "Awww 😂💙 Selfie captured!";


    /*
        Show the Continue button.
    */

    continueButton.style.display =
        "inline-block";


    /*
        Stop the camera after the selfie
        has been taken.

        This is important for privacy
        and battery usage.
    */

    const stream =
        video.srcObject;

    if (stream) {

        stream.getTracks().forEach(
            track => track.stop()
        );

    }


    /*
        IMPORTANT:

        At this point the selfie exists
        only inside the browser.

        To make YOU receive/save the selfie,
        we will upload it to Firebase
        or another backend.
    */

}


// ----------------------------------------------------
// STEP 6: Load the models when the page starts
// ----------------------------------------------------

loadModels();

</script>

</body>
</html>
